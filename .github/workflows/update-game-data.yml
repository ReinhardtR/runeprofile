name: Update Game Data

# Unified daily pipeline: checks OpenRS2 (which archives caches within
# minutes of a game update) for a cache the pipeline hasn't processed yet.
# When there is one, every data-check script and the icon sync run against
# that same downloaded cache, and its id is recorded (marker object in R2)
# only after everything succeeded - a failed run retries the next day.

on:
  schedule:
    # Daily, just after the usual game-update window (Wednesdays ~10:30-11:30
    # UTC); off-schedule cache revisions get picked up at most a day later.
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the latest cache was already processed
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-game-data:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The icon renderer (scripts/item-icons) is a Java project on Gradle
      # 6.6.1, which supports at most Java 15.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a new cache
        id: cache
        run: pnpm script:check-cache --download "$RUNNER_TEMP/osrs-cache" ${{ inputs.force && '--force' || '' }}

      # Each step regenerates one data file from the downloaded cache and
      # writes a /tmp/<name>-changes-summary.txt only when it finds changes.
      # Scripts exit non-zero on real errors so a failure fails the run
      # loudly (no silent PR, and the cache marker is not advanced).
      - name: Update collection log
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_DIR: ${{ steps.cache.outputs.cache_dir }}
        run: pnpm script:update-clog

      - name: Update combat achievements
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_DIR: ${{ steps.cache.outputs.cache_dir }}
        run: pnpm script:update-ca

      - name: Update quests
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_DIR: ${{ steps.cache.outputs.cache_dir }}
        run: pnpm script:update-quests

      # New icons are in the bucket before the game-data PR merges; the
      # atlas picks up new collection log items via the push-triggered
      # sync-item-icons workflow once the PR lands.
      - name: Sync item icons to R2
        if: steps.cache.outputs.new == 'true'
        run: pnpm script:sync-item-icons --cache-dir "${{ steps.cache.outputs.cache_dir }}"

      - name: Build PR body
        id: summary
        if: steps.cache.outputs.new == 'true'
        run: |
          body_file="$(mktemp)"
          has_changes=false
          {
            echo "This PR was automatically generated by the **Update Game Data** workflow."
            echo ""
            echo "Cache: [OpenRS2 #${{ steps.cache.outputs.cache_id }}](https://archive.openrs2.org/caches/runescape/${{ steps.cache.outputs.cache_id }})"
            echo ""
          } >> "$body_file"
          for f in \
            /tmp/clog-changes-summary.txt \
            /tmp/ca-changes-summary.txt \
            /tmp/quests-changes-summary.txt; do
            if [ -f "$f" ]; then
              cat "$f" >> "$body_file"
              echo "" >> "$body_file"
              has_changes=true
            fi
          done
          if [ "$has_changes" = "true" ]; then
            {
              echo "body<<EOF"
              cat "$body_file"
              echo ""
              echo "---"
              echo ""
              echo "Review the per-section notes above for fields that must be filled in manually (e.g. collection log \`hiscore\`/\`aliases\`, quest \`points\`/\`type\`)."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.cache.outputs.new == 'true' && steps.summary.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-game-data
          commit-message: "chore: update game data from OSRS cache"
          title: "chore: update game data"
          body: ${{ steps.summary.outputs.body }}
          labels: automated
          delete-branch: true

      - name: Record cache as processed
        if: steps.cache.outputs.new == 'true'
        run: pnpm script:check-cache --commit ${{ steps.cache.outputs.cache_id }}
