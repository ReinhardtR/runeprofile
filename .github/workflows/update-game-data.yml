name: Update Game Data

# Two independent daily pipelines, gated on different upstream sources:
#
#   update-data (clog/CA/quests): gated on abextm/osrs-cache, a mirror kept
#   within ~2 minutes of a game update by a bot that fetches straight from
#   Jagex's JS5 servers. These checks only read a handful of cache tables
#   over HTTP, so this job is almost always a same-day win.
#
#   update-icons (item + sprite icon rendering): gated on OpenRS2, whose
#   crawl of a fresh cache into a full binary disk store - which the Java
#   icon renderer requires - can take hours to finish, sometimes past this
#   workflow's last run of the day. Data updates matter more than icons and
#   shouldn't wait on that crawl, hence the split.
#
# Each job records its own marker (in R2) only after everything succeeded -
# a failed run retries on the next schedule.

on:
  schedule:
    # The game update lands 11:30 UK time - 10:30 UTC in summer, 11:30 UTC
    # in winter. The 11:31 run catches summer updates (and, usually, the
    # same-day abextm commit) immediately; the 12:31 run covers the winter
    # hour the same day instead of the next.
    - cron: "31 11 * * *"
    - cron: "31 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the latest cache was already processed
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a new data cache
        id: cache
        run: pnpm script:check-data-cache ${{ inputs.force && '--force' || '' }}

      # Each step regenerates one data file from the same pinned
      # abextm/osrs-cache commit and writes a /tmp/<name>-changes-summary.txt
      # only when it finds changes. Scripts exit non-zero on real errors so
      # a failure fails the run loudly (no silent PR, and the marker is not
      # advanced).
      - name: Update collection log
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_COMMIT: ${{ steps.cache.outputs.commit_sha }}
        run: pnpm script:update-clog

      - name: Update combat achievements
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_COMMIT: ${{ steps.cache.outputs.commit_sha }}
        run: pnpm script:update-ca

      - name: Update quests
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_COMMIT: ${{ steps.cache.outputs.commit_sha }}
        run: pnpm script:update-quests

      - name: Build PR body
        id: summary
        if: steps.cache.outputs.new == 'true'
        run: |
          body_file="$(mktemp)"
          has_changes=false
          {
            echo "This PR was automatically generated by the **Update Game Data** workflow."
            echo ""
            echo "Cache: [abextm/osrs-cache @ ${{ steps.cache.outputs.commit_sha }}](https://github.com/abextm/osrs-cache/commit/${{ steps.cache.outputs.commit_sha }})"
            echo ""
          } >> "$body_file"
          for f in \
            /tmp/clog-changes-summary.txt \
            /tmp/ca-changes-summary.txt \
            /tmp/quests-changes-summary.txt; do
            if [ -f "$f" ]; then
              cat "$f" >> "$body_file"
              echo "" >> "$body_file"
              has_changes=true
            fi
          done
          if [ "$has_changes" = "true" ]; then
            {
              echo "body<<EOF"
              cat "$body_file"
              echo ""
              echo "---"
              echo ""
              echo "Review the per-section notes above for fields that must be filled in manually (new collection log pages need \`hiscore\` and \`aliases\`)."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.cache.outputs.new == 'true' && steps.summary.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-game-data
          commit-message: "chore: update game data from OSRS cache"
          title: "chore: update game data"
          body: ${{ steps.summary.outputs.body }}
          labels: automated
          delete-branch: true

      - name: Record commit as processed
        if: steps.cache.outputs.new == 'true'
        run: pnpm script:check-data-cache --commit ${{ steps.cache.outputs.commit_sha }}

  update-icons:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The icon renderer (scripts/item-icons) is a Java project on Gradle
      # 6.6.1, which supports at most Java 15.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a new cache
        id: cache
        run: pnpm script:check-cache --download "$RUNNER_TEMP/osrs-cache" ${{ inputs.force && '--force' || '' }}

      - name: Update sprite icons (hiscore, clan rank)
        if: steps.cache.outputs.new == 'true'
        env:
          OSRS_CACHE_DIR: ${{ steps.cache.outputs.cache_dir }}
        run: pnpm script:update-sprite-icons

      # New item icons land in the bucket here; if this run's cache also
      # contains collection log items too new for the last-merged
      # update-data PR, the push-triggered sync-item-icons workflow covers
      # them once that PR lands.
      - name: Sync item icons to R2
        if: steps.cache.outputs.new == 'true'
        run: pnpm script:sync-item-icons --cache-dir "${{ steps.cache.outputs.cache_dir }}"

      - name: Build PR body
        id: summary
        if: steps.cache.outputs.new == 'true'
        run: |
          body_file="$(mktemp)"
          has_changes=false
          {
            echo "This PR was automatically generated by the **Update Game Data** workflow."
            echo ""
            echo "Cache: [OpenRS2 #${{ steps.cache.outputs.cache_id }}](https://archive.openrs2.org/caches/runescape/${{ steps.cache.outputs.cache_id }})"
            echo ""
          } >> "$body_file"
          if [ -f /tmp/sprite-icons-changes-summary.txt ]; then
            cat /tmp/sprite-icons-changes-summary.txt >> "$body_file"
            echo "" >> "$body_file"
            has_changes=true
          fi
          if [ "$has_changes" = "true" ]; then
            {
              echo "body<<EOF"
              cat "$body_file"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.cache.outputs.new == 'true' && steps.summary.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-game-icons
          commit-message: "chore: update sprite icons from OSRS cache"
          title: "chore: update sprite icons"
          body: ${{ steps.summary.outputs.body }}
          labels: automated
          delete-branch: true

      - name: Record cache as processed
        if: steps.cache.outputs.new == 'true'
        run: pnpm script:check-cache --commit ${{ steps.cache.outputs.cache_id }}
