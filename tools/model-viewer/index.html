<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuneProfile model viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <aside class="panel">
      <h1>Model viewer</h1>

      <div class="boot-error" id="boot-error" hidden></div>

      <fieldset>
        <legend>Dump folder</legend>
        <div class="dir">
          <input
            type="text"
            id="dir"
            spellcheck="false"
            placeholder="~/.runelite/runeprofile/models"
          />
          <button type="button" id="refresh" title="Reload the file list">↻</button>
        </div>
        <p class="group-label">Player</p>
        <ul class="files" id="players"></ul>
        <p class="group-label">Pet</p>
        <ul class="files" id="pets"></ul>
        <p class="hint" id="hint">Loading…</p>
      </fieldset>

      <button type="button" class="file" id="open">Open a file from elsewhere</button>
      <input type="file" id="file" accept=".glb,.gltf,.ply" hidden />

      <dl class="info" id="info" hidden></dl>

      <fieldset>
        <legend>View</legend>
        <div class="views">
          <button type="button" data-azimuth="0">Front</button>
          <button type="button" data-azimuth="45">F·R</button>
          <button type="button" data-azimuth="90">Right</button>
          <button type="button" data-azimuth="135">B·R</button>
          <button type="button" data-azimuth="180">Back</button>
          <button type="button" data-azimuth="225">B·L</button>
          <button type="button" data-azimuth="270">Left</button>
          <button type="button" data-azimuth="315">F·L</button>
        </div>
        <label class="orbit"
          ><input type="checkbox" id="orbit" /> Orbit continuously</label
        >
      </fieldset>

      <fieldset>
        <legend>Rendering</legend>
        <label
          ><input type="checkbox" id="animate-textures" checked /> Animate
          textures</label
        >
        <label
          ><input type="checkbox" id="idle-spin" /> Idle spin (matches the live
          site)</label
        >
      </fieldset>

      <dl class="stats" id="stats"></dl>
    </aside>

    <div class="drop-target" id="drop-target" hidden><span>Drop to load</span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
